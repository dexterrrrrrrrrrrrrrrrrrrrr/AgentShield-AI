# Opt-in trusted execution plane. No TCP listeners or Docker socket on backend.
x-sandbox: &sandbox
  SANDBOX_ENABLED: "true"
  SANDBOX_POLICY: approval
  SANDBOX_NATIVE_IMAGE: ${SANDBOX_NATIVE_IMAGE:?Provision native runtime image}
  SANDBOX_JAVA_IMAGE: ${SANDBOX_JAVA_IMAGE:?Provision Java runtime image}
  SANDBOX_NODE_IMAGE: ${SANDBOX_NODE_IMAGE:?Provision Node runtime image}
  SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-128}
  SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
  SANDBOX_PIDS: ${SANDBOX_PIDS:-32}
  SANDBOX_TIMEOUT: ${SANDBOX_TIMEOUT:-10}
  SANDBOX_COMPILE_TIMEOUT: ${SANDBOX_COMPILE_TIMEOUT:-10}
  SANDBOX_OUTPUT_BYTES: ${SANDBOX_OUTPUT_BYTES:-65536}
  SANDBOX_CODE_BYTES: ${SANDBOX_CODE_BYTES:-32768}
services:
  backend:
    environment:
      <<: *sandbox
      SANDBOX_TRANSPORT: executor
    volumes:
      - executor-control:/run/agentshield-executor:ro
    secrets: [executor_token]
    depends_on:
      executor: {condition: service_healthy}
  executor:
    image: agentshield-executor:1
    build:
      context: ./backend
      target: executor
    environment:
      <<: *sandbox
      SANDBOX_DOCKER_URL: unix:///var/run/docker.sock
    group_add: ["${SANDBOX_DOCKER_GID:?Set Docker socket group ID inside Colima}"]
    network_mode: none
    volumes:
      - executor-control:/run/agentshield-executor
      # Read-only mount does NOT restrict Docker API authority; this service is trusted.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets: [executor_token]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16777216"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 110s
    logging:
      options: {max-size: "10m", max-file: "3"}
volumes:
  executor-control:
secrets:
  executor_token:
    file: ${SANDBOX_EXECUTOR_SECRET_FILE:-./.executor-secrets/token}
