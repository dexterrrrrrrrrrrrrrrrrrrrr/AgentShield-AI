name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  CI_MONGODB_IMAGE: mongo:7@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
  CI_MONGODB_CONTAINER: agentshield-ci-mongo
  TEST_MONGODB_URI: mongodb://127.0.0.1:27017
jobs:
  frontend:
    # Avoid the ubuntu-latest migration to Ubuntu 26.04 during container setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Explicit startup runs after checkout, so failures produce useful diagnostics.
      - name: Start MongoDB 7 and verify readiness
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/mongodb.sh start
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r ../backend/requirements-dev.txt
      - name: Verify MongoDB from the test process
        run: python -c "from pymongo import MongoClient; import os; c = MongoClient(os.environ['TEST_MONGODB_URI'], serverSelectionTimeoutMS=5000); assert c.admin.command('ping')['ok'] == 1; c.close()"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      # Playwright builds and starts the production frontend and test backend.
      - run: npm run test:e2e
        env:
          BACKEND_PYTHON: python
      - name: MongoDB failure diagnostics
        if: failure()
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/mongodb.sh diagnose
      - name: Remove disposable MongoDB and its volumes
        if: always()
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/mongodb.sh stop
  backend:
    # Avoid the ubuntu-latest migration to Ubuntu 26.04 during container setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Explicit startup runs after checkout, so failures produce useful diagnostics.
      - name: Start MongoDB 7 and verify readiness
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/mongodb.sh start
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify MongoDB from the test process
        run: python -c "from pymongo import MongoClient; import os; c = MongoClient(os.environ['TEST_MONGODB_URI'], serverSelectionTimeoutMS=5000); assert c.admin.command('ping')['ok'] == 1; c.close()"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements-dev.txt
      - name: MongoDB failure diagnostics
        if: failure()
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/mongodb.sh diagnose
      - name: Remove disposable MongoDB and its volumes
        if: always()
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/mongodb.sh stop
